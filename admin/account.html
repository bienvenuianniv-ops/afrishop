<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mon compte — AfriShop Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-slot"></div>

        <main class="admin-main">
            <div class="admin-header">
                <h1>Mon compte</h1>
            </div>

            <div class="panel" style="max-width:420px;">
                <div class="panel-title">Changer mon mot de passe</div>

                <div class="login-error" id="password-error"></div>
                <div class="login-error" id="password-success" style="background:#1D9E751f; color:var(--success);"></div>

                <form id="password-form">
                    <div class="form-group">
                        <label>Mot de passe actuel</label>
                        <input type="password" id="current-password" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Confirmer le nouveau mot de passe</label>
                        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Mettre à jour le mot de passe</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/admin-common.js"></script>
    <script src="js/admin-account.js"></script>
</body>
</html>
