<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Commandes — AfriShop Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-slot"></div>

        <main class="admin-main">
            <div class="admin-header">
                <h1>Commandes</h1>
            </div>

            <div class="toolbar">
                <select id="filter-status">
                    <option value="all">Tous les statuts</option>
                    <option value="pending">En attente</option>
                    <option value="processing">En préparation</option>
                    <option value="transit">En transit</option>
                    <option value="delivered">Livrée</option>
                    <option value="cancelled">Annulée</option>
                </select>
                <input type="text" id="filter-search" placeholder="Rechercher (référence, nom, email)...">
            </div>

            <div class="panel">
                <div class="table-scroll">
                    <div id="orders-content"><div class="empty-state">Chargement...</div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin-common.js"></script>
    <script src="js/admin-orders.js"></script>
</body>
</html>
